# Airbus H145, civil five-blade MBB-BK117 D-3, simplified Heli-Gym configuration.
# Loading case: maximum gross mass of 3,800 kg, rounded to 8,378 lb.
# Inertia estimates scale the AW109 baseline by 8378/5401 at fixed radii of gyration.
# CG, component stations, controls, aerodynamic coefficients and contact stiffness
# and damping use the AW109 baseline unless a value is documented below.
# The aircraft has two Arriel 2E engines. HP_LOSS remains a baseline model parameter.
#
# Heli-Gym check at 100 ft AGL, zero wind and 8,378 lb
#   When reusing AW109 settings, hover trim required a normalized pedal command of +1.92 (range -1 to +1).
#
# Sources
#   EASA.R.010, MBB-BK117 D-3, Section 11 (mass, dimensions, blade counts and engines)
#     https://www.easa.europa.eu/en/document-library/type-certificates/rotorcraft-cs-29-cs-27-cs-vlr/easar010-airbus-helicopters-deutschland-mbb-bk117
#   Airbus H145/H145M Ground Rescue Booklet, p. 4 (skid width)
#     https://www.airbus.com/sites/g/files/jlcbta136/files/2025-01/3061-s-00-rev1_2.pdf
#   BK117 D-3 Mechanical System training manual, pp. 05-130 and 05-156
#   (nominal rotor speeds and main rotor twist rate)
#     https://www.scribd.com/document/809978571/BK117-D3-B2-TM-05-Mechanical-system-R03-EN-09-2021-ID38453-37152
#   European Rotorcraft Forum paper, Table 1 (EC145 T2 Fenestron mean chord)
#     https://dspace-erf.nlr.nl/server/api/core/bitstreams/fb92b295-ff98-419c-9915-22242f80ec97/content

HELI:
    IDENT       : "H145"
    NAME        : "Airbus H145 (MBB-BK117 D-3)"
    HP_LOSS     : 90    # [hp] inherited accessory power loss estimate
    VTRANS      : 50    # [ft/s] Downwash transition speed
    FS_CG       : 132.7 # [in] helicopter horizontal CG loc.
    WL_CG       : 38.5  # [in] helicopter vertical CG
    WT          : 8378  # [lb] maximum-mass simulation case, from 3,800 kg
    IX          : 2466  # [slug-ft^2] scaled AW109 estimate
    IY          : 10488  # [slug-ft^2] scaled AW109 estimate
    IZ          : 9939  # [slug-ft^2] scaled AW109 estimate
    IXZ         : 928  # [slug-ft^2] scaled AW109 estimate
    COL_OS      : 6.    # [deg] Collective Offset
    COL_L       : -2.   # [deg] Collective Low
    COL_H       : 15.   # [deg] Collective High
    LON_L       : -12.  # [deg] Lon Cyc Low
    LON_H       : +12.  # [deg] Lon Cyc High
    LAT_L       : -10.  # [deg] Lat Cyc Low
    LAT_H       : +10.  # [deg] Lat Cyc High
    PED_OS      : 45.   # [deg] Pedal Offset
    PED_L       : -15.  # [deg] Pedal Low
    PED_H       : 15.   # [deg] Pedal High
    # --> With the existing open-rotor equations, 
    # maximum-weight hover trim required a normalized pedal command of +1.92, 
    # above the +1 limit. Setting PED_OS = 45 while keeping the low and high values at −15 and +15 
    # would center that same trim near u = 0 and preserve the command sensitivity of 15° per unit.

    MR:  # five-blade bearingless main rotor represented by the existing equivalent-hinge equations
        FS     : 132.4 # [in] hub horizontal location in FS-ref station
        WL     : 98.2 # [in] hub vertical location in FS-ref station
        IS     : 0.11 # [rad] forward shaft tilt incidence
        E      : 0.5  # [ft] inherited equivalent hinge offset for the bearingless rotor
        IB     : 212  # [slug-ft^2] inherited blade flapping inertia
        R      : 17.71654  # [ft] from the 10.80 m diameter
        A      : 5.8 # [1/rad] Blade lift-curve slope
        RPM    : 383.4  # [rpm] nominal mechanical speed
        CD0    : 0.009 # Blade profile drag coefficient
        B      : 5  # published blade count
        C      : 1.1 # [ft] Blade Chord
        TWST   : -0.21677  # [rad] equivalent linear washout from 2.3 deg/m over full radius
        K1     : 0.096 # Blade pitch-flap coupling

    TR:  # Fenestron represented by open-rotor equations. Duct and stator forces are absent.
        FS     : 391 # [in] hub horizontal location in FS-ref station
        WL     : 70 # [in] hub vertical location in FS-ref station
        R      : 1.88648  # [ft] from the 1.15 m Fenestron diameter
        A      : 4.2 # [1/rad] Blade lift-curve slope
        C      : 0.20669  # [ft] proxy mean chord from the EC145 T2 (BK117 D-2) Fenestron
        RPM    : 3122  # [rpm] nominal mechanical speed
        CD0    : 0.009 # Blade profile drag coefficient
        TWST   : -0.137 # [rad] Blade Twist
        B      : 10  # published blade count

    FUS:  # inherited fuselage aerodynamics
        FS     : 132 # [in] horizontal CP loc. in FS-ref station
        WL     : 38 # [in] vertical CP loc. in FS-ref station
        XUU    : -10.8 # [ft^2] parasite
        YVV    : -167 # [ft^2] sideward
        ZWW    : -85 # [ft^2] quadratic
        COR    : 3 # emprical correction for fus. a.c shift magnification

    HT:  # inherited horizontal stabilizer aerodynamics
        FS     : 330 # [in] horizontal CP loc. in FS-ref station (0.25 chord)
        WL     : 54 # [in] vertical CP loc. in FS-ref station
        ZUU    : 0.4 # [ft^2] profile
        ZUW    : -34.0 # [ft^2] circulation lift
        ZMAX   : -22.0 # [ft^2] max. lift

    VT:  # inherited vertical stabilizer aerodynamics
        FS     : 380 # [in] horizontal CP loc. in FS-ref station (0.25chord)
        WL     : 80 # [in] vertical CP loc. in FS-ref station
        YUU    : 3.3 # [ft^2] profile
        YUV    : -47 # [ft^2] circulation lift
        YMAX   : -17 # [ft^2] max. lift

    WN:  # inherited zero-lift wing model
        FS     : 0. # [in] horizontal CP loc. in FS-ref station
        WL     : 0. # [in] vertical CP loc. in FS-ref station
        ZUU    : 0. # [ft^2] profile
        ZUW    : 0. # [ft^2] circulatio lift
        ZMAX   : 0. # [ft^2] max. lift
        B      : 1 # [ft] wing span

    LG:  # fixed skids approximated by three point contacts
        K      : 30000 # [lb/ft]
        C      : 2000 # [lb*s/ft]
        BL_MN  : 47.24  # [in] lateral contact estimate, half the 2.40 m skid width
        FS_MN  : 187  # [in] inherited station for the paired contacts
        FS_N   : 40  # [in] inherited station for the centerline forward contact
        WL     : -22  # [in] inherited contact waterline

    OP:  # inherited simulation attitude thresholds
        SAFE_ROLL :  30.0  # [deg]
        MAX_ROLL :   60.0  # [deg]
        SAFE_PITCH : 15.0  # [deg]
        MAX_PITCH :   25.0  # [deg]
